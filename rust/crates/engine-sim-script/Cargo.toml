[package]
name = "engine-sim-script"
description = "Port of the Engine Simulator's .mr scripting front end (piranha)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "engine_sim_script"
path = "src/lib.rs"

# No external dependencies: the .mr front end has to stay buildable offline and
# be verifiable bit-for-bit against the original piranha sources. `engine-sim-core`
# is this workspace's own port of the engine, and the only reason the front end
# needs it is that two of `es_script`'s node classes compute their value with
# `GasSystem` (`k_28inH2O` and `k_carb`).
[dependencies]
engine-sim-core = { path = "../engine-sim-core" }
