# Two jobs, split by the question they answer (docs/next-steps.md §1):
#
#   tests  -- "does the Rust tree still satisfy its own tests?"  No oracle, no
#             g++, runs on Linux *and* Windows, which is the first time the port
#             is proven to build where the original lives.
#   gates  -- "does it still agree with the original, bit for bit?"  Needs the
#             C++ oracle, one OS, ~6 min, and it is the only thing that makes the
#             word *exact* mean anything. Required for merge.
#
# The toolchain is pinned by rust/rust-toolchain.toml, so CI and a developer run
# the same compiler; see docs/toolchain-performance.md for why that matters.
#
# Every failing step also posts its own output into the pull request. Hosted
# runner logs sit behind an endpoint that a sandboxed client cannot read, and a
# red check with no text is nearly useless; the tail is short on purpose.
name: Rust

on:
  push:
    branches: [master]
    paths:
      - "rust/**"
      - "dependencies/submodules/piranha/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [master]
    paths:
      - "rust/**"
      - "dependencies/submodules/piranha/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          # `builtin_types::tests::the_piranha_table_matches_test_rules_cpp` reads
          # `dependencies/submodules/piranha/test/test_rules.cpp` and panics if it
          # is missing, so the submodules are not optional here.
          submodules: recursive

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Build and test
        run: |
          set -o pipefail
          cargo test --release --all-targets --locked 2>&1 | tee tests.log

      - name: Report failure in the pull request
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### \`tests (${{ matrix.os }})\` failed"
            echo ""
            echo '```'
            tail -n 120 rust/tests.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/comment.md"

  gates:
    name: parity gates (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      # The oracle is C++ built at -O2. It is deliberately *not* built with
      # -march=native: GCC contracts a*b+c into FMA by default for C++, and a
      # wider target could move the reference's own bits.
      - name: Check the C++ toolchain
        run: g++ --version

      - name: Parity gates
        env:
          WORK: ${{ runner.temp }}/parity
        run: |
          set -o pipefail
          bash tools/parity/run_script_parity.sh 2>&1 | tee script-parity.log

      - name: DSP and core traces
        env:
          WORK: ${{ runner.temp }}/parity
        run: |
          set -o pipefail
          bash tools/parity/run_dsp_parity.sh 2>&1 | tee dsp-parity.log
          bash tools/parity/run_core_parity.sh 2>&1 | tee core-parity.log

      - name: Report failure in the pull request
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### \`parity gates (ubuntu)\` failed"
            echo ""
            for log in script-parity dsp-parity core-parity; do
              if [ -f "rust/$log.log" ]; then
                echo "<details><summary>$log.log</summary>"
                echo ""
                echo '```'
                tail -n 80 "rust/$log.log"
                echo '```'
                echo "</details>"
                echo ""
              fi
            done
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/comment.md"
